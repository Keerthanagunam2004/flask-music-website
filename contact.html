<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
</head>
<body class="contact-bg">
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <p style="color:darkblue; font-weight:bold; margin-top:10px;">
        {{ messages[0] }}
    </p>
  {% endif %}
{% endwith %}
{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div style="width:100%; max-width:450px; text-align:center;">
        <h1>Contact Us </h1>
        <p>Share your feedback or favorite music with us.</p>

        <form method="POST" action="/contact"
              style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">

            <input type="text" name="name" placeholder="Your Name" required
                   style="padding:8px; border-radius:4px; border:1px solid #ccc;">

            <input type="email" name="email" placeholder="Your Email" required
                   style="padding:8px; border-radius:4px; border:1px solid #ccc;">

            <textarea name="message" placeholder="Your Message" required
                      style="padding:8px; border-radius:4px; border:1px solid #ccc; min-height:100px;"></textarea>

            <button type="submit"
                    style="padding:10px; border:none; border-radius:4px;
                           background:#e75480; color:white; font-weight:bold; cursor:pointer;">
                Send
            </button>
        </form>
    </div>
</div>
{% endblock %}
</body>
</html>
